# Read the Docs: execute the minimal path of the notebooks on the example project, then build the
# documentation from the repository root (see docs/conf.py)
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - python -m pip install -e ".[docs]"
    - python docs/execute_notebooks.py
    - python -m sphinx -b html -c docs . $READTHEDOCS_OUTPUT/html
