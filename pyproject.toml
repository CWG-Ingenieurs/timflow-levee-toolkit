[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timflow_levee_toolkit"
dynamic = ["version"]
description = "Groundwater analysis of levees with Timflow cross-section models: project set-up, time series, model, response factors"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "timflow[lmfit]>=0.5",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "openpyxl",
    "geopandas",
    "pastastore",
    "jinja2",  # DataFrame.style in the notebooks
    "contextily",  # background maps
    "adjustText",  # labels without overlap in maps
]

[project.optional-dependencies]
# Tests: unit tests and the example test (runs the notebooks)
test = ["pytest", "nbclient", "nbformat", "ipykernel", "ruff"]
# Downloads in the optional notebooks: BRO and Rijkswaterstaat (11, 12), subsurface data (21)
download = ["hydropandas"]
subsurface = ["nlmod", "brodata"]
# Documentation (Read the Docs): Sphinx with the notebooks, which are executed before the build
docs = ["sphinx", "myst-nb", "furo", "nbclient", "nbformat", "ipykernel"]

[tool.setuptools]
packages = ["timflow_levee_toolkit"]

[tool.setuptools.dynamic]
version = { attr = "timflow_levee_toolkit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the example notebooks (about 2 minutes); skip with -m \"not slow\""]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Errors only (syntax, undefined names, unused imports); style rules can be added later
select = ["E9", "F"]
