name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # The example notebooks download background maps from OpenStreetMap: run them once a week
  # (and on request), not on every push or pull request
  schedule:
    - cron: "0 5 * * 1"  # Monday 05:00 UTC

jobs:
  unit:
    name: ruff and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - run: ruff check timflow_levee_toolkit tests
      - run: pytest -m "not slow"

  docs:
    name: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[docs]"
      # Without executing the notebooks (Read the Docs does that): checks the configuration and pages
      - run: python -m sphinx -b html -c docs . docs/_build/html

  example:
    name: example notebooks
    needs: unit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -m slow
