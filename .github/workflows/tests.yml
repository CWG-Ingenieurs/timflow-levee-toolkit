name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: ruff and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - run: ruff check timflow_levee_toolkit tests
      - run: pytest -m "not slow"

  example:
    name: example notebooks
    needs: unit
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -m slow
